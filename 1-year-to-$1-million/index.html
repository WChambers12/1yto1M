<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1 Year to $1 Million | The Balanced Marathon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #F8FAFC;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6, .brand-font {
        font-family: 'Montserrat', sans-serif;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        
        /* Directional border lighting */
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-top-color: rgba(255, 255, 255, 0.8);
        border-left-color: rgba(255, 255, 255, 0.8);
        
        /* Deep drop shadow + subtle inner glow for thickness */
        box-shadow: 
          0 8px 32px 0 rgba(31, 38, 135, 0.08),
          inset 0 0 0 1px rgba(255, 255, 255, 0.1),
          inset 0 0 20px rgba(255, 255, 255, 0.2);
      }
      .liquid-blob {
        animation: blob-bounce 10s infinite ease-in-out;
      }
      @keyframes blob-bounce {
        0%, 100% { transform: translate(0, 0) scale(1); }
        25% { transform: translate(10px, -15px) scale(1.05); }
        50% { transform: translate(-5px, 10px) scale(0.95); }
        75% { transform: translate(-10px, -5px) scale(1.02); }
      }
      
      /* New Animations */
      .animate-fade-in-up {
        animation: fadeInUp 0.8s ease-out forwards;
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-loading-progress {
        animation: loading-progress 2s infinite ease-in-out;
      }
      @keyframes loading-progress {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(0%); }
        100% { transform: translateX(100%); }
      }
    </style>
